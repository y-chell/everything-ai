[project]
name = "everything-ai"
version = "0.1.0"
description = "AI-native full-disk file search via NTFS MFT + USN Journal (Everything mechanism reimplemented) as an MCP server"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0"]

[project.scripts]
everything-ai = "everything_ai.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["everything_ai"]
